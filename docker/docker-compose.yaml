# Usage (from the workspace root):
#   docker compose -f docker/docker-compose.yaml up -d --build
#   docker compose -f docker/docker-compose.yaml exec ur7e_lego bash
#   docker compose -f docker/docker-compose.yaml down
# Software rendering: RENDER_MODE=software docker compose -f docker/docker-compose.yaml up -d
name: ur7e_lego

services:
  ur7e_lego:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: 1001
        USER_GID: 1001
    image: ur7e_lego:jazzy
    container_name: ur7e_lego
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      - DISPLAY=${DISPLAY:-:1}
      - XAUTHORITY=/home/ros/.Xauthority
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - UR_TYPE=${UR_TYPE:-ur7e}
      - RENDER_MODE=${RENDER_MODE:-gpu}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
    volumes:
      - ..:/home/ros/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1001/gdm/Xauthority}:/home/ros/.Xauthority:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
